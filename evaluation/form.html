<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <h2>Donar Information</h2>
        <table>
            <tr>
                <td><label for="firstname">FirstName*</label></td>
                <td><input type="text" id="firstname" name="name" required></td>
            </tr>
            <tr>
                <td><label for="lastname">LastName*</label></td>
                <td><input type="text" id="lastname" name="lastname" required></td>
            </tr>
            <tr>
                <td><label for="Company">Company</label></td>
                <td><input type="text" id="Company" name="Company" required></td>
            </tr>
            <tr>
                <td> <label for="Adress1">Adress1*</label></td>
                <td><input type="text" id="Adress1" name="Adress1" required></td>

            </tr>
            <tr>
                <td> <label for="Adress2">Adress2*</label></td>
                <td><input type="text" id="Adress2" name="Adress2" required></td>

            </tr>
            <tr>
                <td> <label for="city">city*</label></td>
                <td><input type="text" id="city" name="city" required></td>

            </tr>

            <tr>
                <td><label for="state">State</label></td>
                <td> <select name="state" id="state">
                        <option> select a state</option>
                        <option>NYC</option>
                        <option>Florida</option>
                    </select></td>
            </tr>

            <tr>
                <td> <label for="zip code">Zip Code*</label></td>
                <td><input type="text" id="zip code" name="zip code" required></td>

            </tr>
            <tr>
                <td><label for="country">country*</label></td>
                <td> <select name="country" id="country">
                        <option> select a country</option>
                        <option>USA</option>
                        <option>UK</option>
                    </select></td>
            </tr>
            <tr>
                <td> <label for="phone">Phone*</label></td>
                <td><input type="tel" id="phone" name="phone" required></td>

            </tr>
            <tr>
                <td> <label for="fax">Fax*</label></td>
                <td><input type="tel" id="fax" name="fax" required></td>

            </tr>
            <tr>
                <td> <label for="email">email*</label></td>
                <td><input type="email" id="email" name="email" required></td>

            </tr>
            <tr>
                <td> <label>Donation Amount*<br>(check a button or type in your amount)</label></td>
                <td>
                    <input type="radio" name="a" value="none">None
                    <input type="radio" name="a" value="$50">$50
                    <input type="radio" name="a" value="75">$75
                    <input type="radio" name="a" value="100">$100
                    <input type="radio" name="a" value="250">$250
                    <input type="radio" name="a" value="other">Other
                </td>



            </tr>
            <tr>

                <td></td>

                <td><label for="other amount">Other Amount$</label></td>

                <td><input type="text" name="other amount" id="other amount"></td>

            </tr>
            <tr>
                <td><label>Recurring Donation <br>(Check if yes)</label></td>
                <td><input type="checkbox" value="b">I an intarested in giving on a regular basis</td>
            </tr>
            <tr>
                <td></td>
                <td><label>Monthly Credit Card$ </label></td>
                <td><input type="text" name="c" id="c"></td>
                <td><label> For </label></td>
                <td><input type="text" name="f" id="f"></td>
                <td><label> Months </label></td>


            </tr>

        </table>

        <h2>Honorarium and Memorial Donation Information</h2>
        <table>
            <tr>
                <td>I would like to make this donation</td>
                <td>
                    <input type="radio" id="honor" name="honor" value="honor"> <label for="honor">To
                        Honor</label><br>
                    <input type="radio" id="in_memory" name="honorType" value="memory"> <label for="in_memory">In Memory
                        of</label>
                </td>
            </tr>
            <tr>
                <td><label for="honorName">Name</label></td>
                <td><input type="text" id="honorName" name="honorName"></td>
            </tr>
            <tr>
                <td><label>Acknowledge Donation to</label></td>
                <td><input type="text" id="ackDonation" name="ackDonation"></td>
            </tr>
            <tr>
                <td><label for="ackAddress">Address</label></td>
                <td><input type="text" id="ackAddress" name="ackAddress"></td>
            </tr>
            <tr>
                <td><label for="ackCity">City</label></td>
                <td><input type="text" id="ackCity" name="ackCity"></td>
            </tr>
            <tr>
                <td><label for="ackState">State</label></td>
                <td>
                    <select id="ackState" name="ackState" required>
                        <option value="">Select a State</option>
                        <option>Florida</option>
                        <option>NYC</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="ackZip">Zip</label></td>
                <td><input type="text" id="ackZip" name="ackZip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>

        </table>


    </form>

</body>

</html>
